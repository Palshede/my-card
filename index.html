<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Card</title>
  <!-- ================================================
       STEP 1 — Change the tab title above (My Card)
       ================================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    /* ============================================================
       THEME — tweak the colours here to match your style
       ============================================================ */
    :root {
      --accent:        #534AB7;   /* header background */
      --accent-mid:    #AFA9EC;   /* avatar border + icon tints */
      --accent-light:  #EEEDFE;   /* avatar background */
      --accent-dark:   #3C3489;   /* avatar initials colour */
      --accent-text:   #EEEDFE;   /* name on header */
      --accent-sub:    #AFA9EC;   /* tagline on header */
      --bg:            #ffffff;
      --bg-surface:    #f5f4f9;
      --bg-page:       #ede9f8;
      --border:        rgba(0,0,0,0.10);
      --text:          #1a1a1a;
      --text-muted:    #6b6880;
      --radius-card:   20px;
      --radius-el:     10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-page);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ---- Card shell ---- */
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--bg);
      border-radius: var(--radius-card);
      border: 0.5px solid var(--border);
      overflow: hidden;
    }

    /* ---- Header ---- */
    .card-header {
      background: var(--accent);
      padding: 2.25rem 1.75rem 1.75rem;
      text-align: center;
    }

    /* ---- Profile photo / initials ---- */
    .avatar-wrap {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 3px solid var(--accent-mid);
      background: var(--accent-light);
      margin: 0 auto 1.1rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* If you add a photo, the <img> inside fills the circle */
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Shown when there is NO photo */
    .avatar-initials {
      font-family: 'DM Serif Display', serif;
      font-size: 30px;
      color: var(--accent-dark);
      user-select: none;
    }

    .card-name {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      font-weight: 400;
      color: var(--accent-text);
      margin-bottom: 4px;
    }

    .card-tagline {
      font-size: 13px;
      color: var(--accent-sub);
    }

    /* ---- Body ---- */
    .card-body { padding: 1.4rem 1.5rem; }

    .section-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* ---- Contact pills (phone + email side by side) ---- */
    .contact-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.1rem;
    }

    .contact-pill {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--bg-surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-el);
      padding: 9px 11px;
      text-decoration: none;
      font-size: 13px;
      color: var(--text);
      overflow: hidden;
      transition: background 0.15s;
    }
    .contact-pill:hover { background: var(--bg-page); }

    .contact-pill svg {
      flex-shrink: 0;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .contact-pill span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---- Divider ---- */
    .divider {
      border: none;
      border-top: 0.5px solid var(--border);
      margin: 0.9rem 0 1rem;
    }

    /* ---- Social buttons ---- */
    .socials { display: flex; flex-direction: column; gap: 8px; }

    .social-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 13px;
      border-radius: var(--radius-el);
      border: 0.5px solid var(--border);
      background: var(--bg);
      text-decoration: none;
      transition: background 0.15s;
    }
    .social-btn:hover { background: var(--bg-surface); }

    .social-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .social-info { flex: 1; }
    .social-info .s-name  { font-size: 14px; font-weight: 500; color: var(--text); }
    .social-info .s-handle { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

    .social-btn .arrow {
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ---- Footer ---- */
    .card-footer {
      border-top: 0.5px solid var(--border);
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .card-footer span { font-size: 12px; color: var(--text-muted); }
  </style>
</head>
